<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; script-src 'sha256-6YuTQKoeoLVTFIJ01gK9zS7CNtESaovW/NF/Okh2BDI='; base-uri 'none'; form-action 'none'">
<meta name="robots" content="noindex, nofollow">
<title>Family Travel Business – Bezahlvorschau</title>
<style>
:root{
  --blue:#2f6bd8; --blue-dark:#1f4fa8; --blue-soft:#e8f0fd; --sky:#8fb3ee;
  --ink:#16213a; --muted:#5d6b85; --line:#e3e8f1; --bg:#f6f8fc; --card:#fff;
  --green:#1f9d63; --green-soft:#e5f6ee; --red:#d0453a; --red-soft:#fdecea; --amber:#b7791f; --amber-soft:#fdf4e3;
  --radius:18px; --shadow:0 1px 2px rgba(22,33,58,.06),0 8px 24px rgba(22,33,58,.06);
}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg);line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
.demo{position:sticky;top:0;z-index:20;background:var(--ink);color:#fff;font-size:13px;text-align:center;padding:7px 16px}
.demo button{background:none;border:0;color:var(--sky);text-decoration:underline;cursor:pointer;padding:0 0 0 8px}
header{background:#fff;border-bottom:1px solid var(--line)}
.testmode{margin-top:10px;text-align:center;font-size:13px;font-weight:600;color:var(--amber);background:var(--amber-soft);border-radius:10px;padding:8px}
header .wrap{display:flex;align-items:center;gap:24px;height:68px}
header img{height:34px;display:block}
nav{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
nav a{padding:8px 14px;border-radius:999px;font-size:15px;color:var(--muted)}
nav a.on{background:var(--blue-soft);color:var(--blue-dark);font-weight:600}
main{min-height:70vh;padding-bottom:64px}
h1{font-size:clamp(30px,5vw,48px);line-height:1.1;letter-spacing:-.02em;margin:0 0 14px}
h2{font-size:26px;letter-spacing:-.01em;margin:0 0 16px}
h3{font-size:18px;margin:0 0 6px}
.lead{font-size:18px;color:var(--muted);max-width:620px}
.hero{background:linear-gradient(135deg,var(--blue) 0%,var(--sky) 100%);color:#fff;border-radius:28px;margin:24px 0 36px;padding:56px 48px;position:relative;overflow:hidden}
.hero .lead{color:rgba(255,255,255,.9)}
.hero:after{content:"";position:absolute;right:-80px;bottom:-120px;width:380px;height:380px;border-radius:50%;background:rgba(255,255,255,.12)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 16px;cursor:pointer;font-size:15px}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column}
.card .pic{height:150px;display:flex;align-items:flex-end;padding:14px;color:#fff;font-weight:600;font-size:14px}
.card .body{padding:18px;display:flex;flex-direction:column;gap:8px;flex:1}
.card .meta{font-size:14px;color:var(--muted)}
.card .row{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:8px}
.price{font-weight:700;font-size:18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:11px 18px;font-weight:600;cursor:pointer;background:var(--blue);color:#fff;font-size:15px}
.btn:hover{background:var(--blue-dark)}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--bg)}
.btn.danger{background:#fff;color:var(--red);border:1px solid #f1c9c5}
.btn.small{padding:7px 12px;font-size:14px;border-radius:10px}
.btn.wide{width:100%;padding:14px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.avatar{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;flex:none}
.avatar.big{width:96px;height:96px;font-size:34px}
.seller{display:flex;gap:10px;align-items:center;font-size:14px}
.panel{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:24px}
.two{display:grid;grid-template-columns:1.4fr 1fr;gap:24px;align-items:start}
.back{display:inline-block;margin:24px 0 16px;color:var(--muted);font-size:15px}
.badge{display:inline-block;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--blue-soft);color:var(--blue-dark)}
.badge.green{background:var(--green-soft);color:var(--green)}
.badge.amber{background:var(--amber-soft);color:var(--amber)}
.badge.red{background:var(--red-soft);color:var(--red)}
.note{font-size:14px;color:var(--muted);background:var(--bg);border-radius:12px;padding:12px 14px}
label{display:block;font-size:14px;font-weight:600;margin:14px 0 6px}
input,select,textarea{width:100%;border:1px solid #cfd7e6;border-radius:10px;padding:11px 12px;background:#fff}
input:focus,select:focus,textarea:focus{outline:2px solid var(--blue-soft);border-color:var(--blue)}
.err{color:var(--red);font-size:14px;margin-top:8px;min-height:20px}
.split{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stripe{border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:8px}
.stripe .tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:6px}
.stripe .tab{border:1px solid var(--line);border-radius:10px;padding:10px 6px;font-size:13px;text-align:center;cursor:pointer;background:#fff}
.stripe .tab.on{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue);color:var(--blue-dark);font-weight:600}
.powered{font-size:12px;color:var(--muted);text-align:center;margin-top:12px}
.lines div{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
.lines div:last-child{border-bottom:0}
.lines .total{font-weight:700;font-size:17px}
.flow{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}
.flow div{background:var(--bg);border-radius:14px;padding:14px;text-align:center}
.flow b{display:block;font-size:20px}
.flow span{font-size:13px;color:var(--muted)}
.tabsbar{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:8px 0 24px;overflow-x:auto}
.tabsbar a{padding:12px 16px;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tabsbar a.on{color:var(--ink);border-color:var(--blue);font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:24px}
.kpi{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:20px}
.kpi span{font-size:14px;color:var(--muted)}
.kpi b{display:block;font-size:28px;letter-spacing:-.01em;margin-top:4px}
table{width:100%;border-collapse:collapse;font-size:15px}
th{text-align:left;font-size:13px;color:var(--muted);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line)}
td{padding:12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tablewrap{overflow-x:auto}
.empty{text-align:center;color:var(--muted);padding:40px 16px}
.list-item{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.list-item:last-child{border-bottom:0}
.list-item .grow{flex:1;min-width:0}
.actions{display:flex;gap:8px}
.modal-bg{position:fixed;inset:0;background:rgba(22,33,58,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal{background:#fff;border-radius:22px;max-width:480px;width:100%;padding:28px;max-height:92vh;overflow:auto}
.steps{display:flex;gap:6px;margin-bottom:20px}
.steps i{flex:1;height:4px;border-radius:4px;background:var(--line)}
.steps i.on{background:var(--blue)}
.stripe-head{display:flex;align-items:center;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:14px}
.upload{border:2px dashed #cfd7e6;border-radius:14px;padding:28px;text-align:center;cursor:pointer;color:var(--muted)}
.upload.done{border-color:var(--green);color:var(--green);background:var(--green-soft)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:12px;font-size:15px;z-index:60}
.spinner{width:18px;height:18px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ok-circle{width:72px;height:72px;border-radius:50%;background:var(--green-soft);color:var(--green);display:flex;align-items:center;justify-content:center;margin:0 auto 18px}
.center{text-align:center}
.profile-head{display:flex;gap:24px;align-items:center;margin-bottom:28px}
.faq{border-bottom:1px solid var(--line);padding:4px 0}
.faq:last-child{border-bottom:0}
.faq summary{cursor:pointer;font-weight:600;padding:12px 0;list-style-position:outside}
.faq p{margin:0 0 14px;color:var(--muted)}
footer{border-top:1px solid var(--line);padding:24px 0;font-size:13px;color:var(--muted)}
@media (max-width:820px){
  .two{grid-template-columns:1fr}
  .hero{padding:36px 24px}
  header .wrap{height:auto;padding-top:10px;padding-bottom:10px;flex-wrap:wrap;gap:8px}
  nav{margin-left:0;flex-wrap:nowrap}
  nav a{padding:6px 10px;font-size:14px}
  .flow{grid-template-columns:1fr}
  .profile-head{flex-direction:column;align-items:flex-start}
  .split{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="demo">Vorschau mit Testdaten · alle Zahlungen sind simuliert<button id="reset" type="button">Testdaten zurücksetzen</button></div>
<header>
  <div class="wrap">
    <a href="#/"><img src="logo.png" alt="Family Travel Business"></a>
    <nav>
      <a href="#/" data-nav="entdecken">Entdecken</a>
      <a href="#/anleitung" data-nav="anleitung">So verkaufst du</a>
      <a href="#/bereich" data-nav="bereich">Mein Bereich</a>
      <a href="#/admin" data-nav="admin">Verwaltung</a>
    </nav>
  </div>
</header>
<main id="app" class="wrap"></main>
<footer><div class="wrap">Family Travel Business LLC · Florida, USA · Vermittlungsplattform – Verträge kommen direkt zwischen Kunde und Mitglied zustande.</div></footer>

<script>
"use strict";

const STORAGE_NAME = "ftb-vorschau-v1";
const CATEGORIES = ["Gesundheit", "Persönlichkeit", "Kreativität", "Wissen & Beruf"];
const STRIPE_PERCENT = 1.5;
const STRIPE_FIXED_CENTS = 25;
const DECLINED_TEST_CARD = "4000000000000002";
const SUCCESS_TEST_CARD = "4242424242424242";
const PROCESSING_DELAY_MS = 1400;

const GRADIENTS = [
  "linear-gradient(135deg,#2f6bd8,#8fb3ee)",
  "linear-gradient(135deg,#1f9d63,#9be0bd)",
  "linear-gradient(135deg,#d0733a,#f6c28b)",
  "linear-gradient(135deg,#7a4fd0,#c3aef3)",
  "linear-gradient(135deg,#c2416b,#f3a6be)",
  "linear-gradient(135deg,#0f8a9d,#8fd9e3)"
];

function seedData() {
  return {
    commissionPercent: 15,
    setupFeeCents: 29900,
    currentMemberId: "m1",
    members: [
      { id: "m1", name: "Lena Hoffmann", topic: "Achtsamkeit & Reisen", category: "Persönlichkeit", city: "Freiburg", color: 0, status: "aktiv", payouts: true, setupPaid: true,
        bio: "Ich begleite Familien, die unterwegs zur Ruhe finden wollen – mit Retreats, Online-Kursen und 1:1-Gesprächen." },
      { id: "m2", name: "Marco Weiß", topic: "Social Media für Selbstständige", category: "Wissen & Beruf", city: "Köln", color: 3, status: "aktiv", payouts: true, setupPaid: true,
        bio: "Sichtbar werden, ohne sich zu verbiegen: Ich zeige dir, wie du mit ehrlichem Content Kunden gewinnst." },
      { id: "m3", name: "Aylin Kaya", topic: "Ayurveda & Ernährung", category: "Gesundheit", city: "Teneriffa", color: 1, status: "aktiv", payouts: true, setupPaid: true,
        bio: "Ayurvedische Küche und Routinen, die in den Familienalltag passen – zu Hause und auf Reisen." },
      { id: "m4", name: "Jonas Berger", topic: "Fotografie unterwegs", category: "Kreativität", city: "Lissabon", color: 2, status: "wartet", payouts: false, setupPaid: false,
        bio: "Reisefotografie mit dem Handy: schöne Erinnerungen statt tausend verwackelter Bilder." }
    ],
    offers: [
      { id: "o1", memberId: "m1", title: "Familien-Retreat Gran Canaria", type: "Reise", priceCents: 129000, desc: "5 Tage am Meer mit Meditation, Kinderprogramm und viel freier Zeit. Unterkunft inklusive." },
      { id: "o2", memberId: "m1", title: "Achtsam unterwegs – Online-Kurs", type: "Kurs", priceCents: 14900, desc: "8 kurze Lektionen für mehr Gelassenheit im Reisealltag, mit Übungen für Kinder." },
      { id: "o3", memberId: "m2", title: "Content-Boost 1:1 (3 Termine)", type: "Coaching", priceCents: 49000, desc: "Drei Termine à 60 Minuten: Profil, Content-Plan und deine ersten Reels." },
      { id: "o4", memberId: "m2", title: "Crashkurs Instagram", type: "Kurs", priceCents: 9700, desc: "In 90 Minuten vom leeren Profil zum klaren Auftritt." },
      { id: "o5", memberId: "m3", title: "Ayurveda-Kochkurs für Familien", type: "Kurs", priceCents: 7900, desc: "Vier einfache Rezepte live, mit Einkaufsliste und Gewürzplan." },
      { id: "o6", memberId: "m3", title: "Persönliche Ernährungsberatung", type: "Coaching", priceCents: 18000, desc: "Typbestimmung, Gespräch und ein Plan, der zu eurem Alltag passt." }
    ],
    orders: [
      { id: "b1001", offerId: "o3", buyer: "Sabine M.", email: "sabine@example.com", grossCents: 49000, commissionPercent: 15, date: "2026-10-21" },
      { id: "b1002", offerId: "o5", buyer: "Familie Roth", email: "roth@example.com", grossCents: 7900, commissionPercent: 15, date: "2026-10-27" },
      { id: "b1003", offerId: "o1", buyer: "Kai L.", email: "kai@example.com", grossCents: 129000, commissionPercent: 15, date: "2026-10-30" }
    ],
    setupFees: [
      { memberId: "m1", cents: 29900, date: "2026-09-12" },
      { memberId: "m2", cents: 29900, date: "2026-09-18" },
      { memberId: "m3", cents: 29900, date: "2026-10-02" }
    ]
  };
}

const SAFE_ID = /^[a-z0-9]{1,40}$/;
const isSafeId = value => typeof value === "string" && SAFE_ID.test(value);
const isCents = value => Number.isInteger(value) && value >= 0 && value <= 100000000;
const isPrice = value => Number.isInteger(value) && value >= 100 && value <= 5000000;
const isPercent = value => Number.isFinite(value) && value >= 0 && value <= 50;
const isText = value => typeof value === "string" && value.length <= 600;

function isValidState(data) {
  if (!data || typeof data !== "object") return false;
  const { members, offers, orders, setupFees } = data;
  if (![members, offers, orders, setupFees].every(Array.isArray)) return false;
  if (!isPercent(data.commissionPercent) || !isCents(data.setupFeeCents) || !isSafeId(data.currentMemberId)) return false;
  const memberIds = new Set(members.map(m => m && m.id));
  const offerIds = new Set(offers.map(o => o && o.id));
  return members.every(m => m && isSafeId(m.id) && [m.name, m.topic, m.category, m.city, m.bio, m.status].every(isText)
      && Number.isInteger(m.color) && m.color >= 0 && typeof m.payouts === "boolean" && typeof m.setupPaid === "boolean")
    && offers.every(o => o && isSafeId(o.id) && memberIds.has(o.memberId) && [o.title, o.type, o.desc].every(isText) && isPrice(o.priceCents)
      && (o.archived === undefined || typeof o.archived === "boolean"))
    && orders.every(o => o && isSafeId(o.id) && offerIds.has(o.offerId) && isText(o.buyer) && isCents(o.grossCents)
      && isPercent(o.commissionPercent) && /^\d{4}-\d{2}-\d{2}$/.test(o.date))
    && setupFees.every(f => f && memberIds.has(f.memberId) && isCents(f.cents) && /^\d{4}-\d{2}-\d{2}$/.test(f.date))
    && memberIds.has(data.currentMemberId);
}

function loadState() {
  let raw = null;
  try {
    raw = localStorage.getItem(STORAGE_NAME);
  } catch (error) {
    console.warn("Browser-Speicher nicht verfügbar, starte mit Testdaten.", error);
  }
  if (!raw) return seedData();
  let parsed;
  try {
    parsed = JSON.parse(raw);
  } catch (error) {
    if (!(error instanceof SyntaxError)) throw error;
    console.warn("Gespeicherte Testdaten nicht lesbar, starte neu.", error);
    return seedData();
  }
  if (isValidState(parsed)) return parsed;
  console.warn("Gespeicherte Testdaten ungültig, starte neu.");
  return seedData();
}

let state = loadState();

function saveState() {
  try {
    localStorage.setItem(STORAGE_NAME, JSON.stringify(state));
  } catch (error) {
    console.warn("Testdaten konnten nicht gespeichert werden.", error);
  }
}

function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
}

function euro(cents) {
  return (cents / 100).toLocaleString("de-DE", { style: "currency", currency: "EUR" });
}

function formatDate(iso) {
  return new Date(iso + "T12:00:00").toLocaleDateString("de-DE", { day: "2-digit", month: "2-digit", year: "numeric" });
}

function splitPayment(grossCents, commissionPercent) {
  const commissionCents = Math.round(grossCents * commissionPercent / 100);
  const stripeFeeCents = Math.round(grossCents * STRIPE_PERCENT / 100) + STRIPE_FIXED_CENTS;
  return { commissionCents, stripeFeeCents, payoutCents: grossCents - commissionCents - stripeFeeCents };
}

const memberById = id => state.members.find(m => m.id === id);
const currentMember = () => memberById(state.currentMemberId) || state.members[0];
const offerById = id => state.offers.find(o => o.id === id);
const initials = name => name.split(" ").map(part => part[0]).join("").slice(0, 2).toUpperCase();
const avatar = (member, big) => `<div class="avatar${big ? " big" : ""}" style="background:${GRADIENTS[member.color % GRADIENTS.length]}">${escapeHtml(initials(member.name))}</div>`;
const isBookable = offer => { const m = memberById(offer.memberId); return !offer.archived && m && m.status === "aktiv" && m.payouts; };
const newId = prefix => prefix + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

function toast(message) {
  const el = document.createElement("div");
  el.className = "toast";
  el.textContent = message;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2600);
}

function offerCard(offer) {
  const member = memberById(offer.memberId);
  return `<a class="card" href="#/angebot/${offer.id}">
    <div class="pic" style="background:${GRADIENTS[member.color % GRADIENTS.length]}">${escapeHtml(offer.type)}</div>
    <div class="body">
      <h3>${escapeHtml(offer.title)}</h3>
      <div class="seller">${avatar(member)}<div><b>${escapeHtml(member.name)}</b><div class="meta">${escapeHtml(member.topic)}</div></div></div>
      <div class="row"><span class="price">${euro(offer.priceCents)}</span><span class="btn small">Ansehen</span></div>
    </div></a>`;
}

/* ---------- Seiten ---------- */

let activeCategory = "Alle";

function pageHome() {
  const offers = state.offers.filter(isBookable).filter(o => activeCategory === "Alle" || memberById(o.memberId).category === activeCategory);
  return `<section class="hero">
      <h1>Lernen, Lachen, Leuchten</h1>
      <p class="lead">Reisen, Kurse und Coachings unserer Mitglieder – direkt buchen und sicher bezahlen.</p>
    </section>
    <div class="chips">${["Alle", ...CATEGORIES].map(c => `<button class="chip${c === activeCategory ? " on" : ""}" data-category="${escapeHtml(c)}">${escapeHtml(c)}</button>`).join("")}</div>
    ${offers.length ? `<div class="grid">${offers.map(offerCard).join("")}</div>` : `<div class="panel empty">In diesem Bereich gibt es gerade keine buchbaren Angebote.</div>`}`;
}

function pageMember(id) {
  const member = memberById(id);
  if (!member) return pageNotFound();
  const offers = state.offers.filter(o => o.memberId === id && isBookable(o));
  return `<a class="back" href="#/">← Alle Angebote</a>
    <div class="profile-head">${avatar(member, true)}<div>
      <span class="badge">${escapeHtml(member.category)}</span>
      <h1 style="margin-top:8px">${escapeHtml(member.name)}</h1>
      <p class="lead" style="margin:0">${escapeHtml(member.bio)}</p></div></div>
    <h2>Angebote</h2>
    ${offers.length ? `<div class="grid">${offers.map(offerCard).join("")}</div>` : `<div class="panel empty">Noch keine buchbaren Angebote.</div>`}`;
}

function pageOffer(id) {
  const offer = offerById(id);
  if (!offer) return pageNotFound();
  const member = memberById(offer.memberId);
  if (!member) return pageNotFound();
  const bookable = isBookable(offer);
  return `<a class="back" href="#/mitglied/${member.id}">← ${escapeHtml(member.name)}</a>
    <div class="two">
      <div class="panel">
        <div class="pic" style="height:220px;border-radius:14px;background:${GRADIENTS[member.color % GRADIENTS.length]};margin-bottom:20px"></div>
        <span class="badge">${escapeHtml(offer.type)}</span>
        <h1 style="margin-top:10px">${escapeHtml(offer.title)}</h1>

function memberSales(memberId) {
  return state.orders.filter(o => offerById(o.offerId)?.memberId === memberId);
}

function pageMemberArea(tab) {
  const member = currentMember();
  const views = { "": memberOverview, angebote: memberOffers, verkaeufe: memberSalesView, profil: memberProfile };
  return memberTabs(member, tab) + (Object.hasOwn(views, tab) ? views[tab] : memberOverview)(member);
}

function memberOverview(member) {
  const sales = memberSales(member.id);
  const payoutTotal = sales.reduce((sum, o) => sum + splitPayment(o.grossCents, o.commissionPercent).payoutCents, 0);
  const steps = [
    { done: member.setupPaid, title: "Einrichtungsgebühr", text: `Einmalig ${euro(state.setupFeeCents)} für dein Profil im Netzwerk.`, action: `<button class="btn small" data-action="pay-setup">Jetzt bezahlen</button>` },
    { done: member.payouts, title: "Verkauf freischalten", text: "Einmalige Identitätsprüfung bei Stripe, dauert etwa 5 Minuten.", action: `<button class="btn small" data-action="onboard"${member.setupPaid ? "" : " disabled"}>Starten</button>` },
    { done: member.status === "aktiv", title: "Freigabe durch Family Travel Business", text: "Wir schauen kurz drüber, dann ist dein Profil sichtbar.", action: `<span class="badge amber">in Prüfung</span>` }
  ];
  const ready = steps.every(s => s.done);
  return `${ready ? "" : `<div class="panel" style="margin-bottom:24px"><h2>In drei Schritten verkaufen</h2>
      ${steps.map(s => `<div class="list-item"><div class="grow"><b>${s.title}</b><div class="meta" style="color:var(--muted)">${s.text}</div></div>${s.done ? `<span class="badge green">erledigt</span>` : s.action}</div>`).join("")}</div>`}
    <div class="kpis">
      <div class="kpi"><span>Verkäufe</span><b>${sales.length}</b></div>
      <div class="kpi"><span>Ausgezahlt an dich</span><b>${euro(payoutTotal)}</b></div>
      <div class="kpi"><span>Status</span><b style="font-size:20px;margin-top:10px">${ready ? `<span class="badge green">Verkauf aktiv</span>` : `<span class="badge amber">noch nicht aktiv</span>`}</b></div>
    </div>
    <p class="note">Auszahlungen kommen automatisch von Stripe auf dein Konto, meist innerhalb von 2–7 Tagen nach dem Verkauf.</p>`;
}

function memberOffers(member) {
  const offers = state.offers.filter(o => o.memberId === member.id && !o.archived);
  return `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px"><h2 style="margin:0">Meine Angebote</h2><button class="btn" data-action="new-offer">Neues Angebot</button></div>
    <div class="panel">${offers.length ? offers.map(o => `<div class="list-item">

function memberSalesView(member) {

function memberProfile(member) {

/* ---------- Dialoge ---------- */

function openModal(html, onMount) {
  closeModal();
  const bg = document.createElement("div");
  bg.className = "modal-bg";
  bg.id = "modal";
  bg.innerHTML = `<div class="modal" role="dialog" aria-modal="true">${html}</div>`;
  bg.addEventListener("click", e => { if (e.target === bg || e.target.closest("[data-close]")) closeModal(); });
  document.body.appendChild(bg);
  onMount?.(bg);
}

function closeModal() {
  document.getElementById("modal")?.remove();
}

function openOfferDialog(offerId) {
  const offer = offerId ? offerById(offerId) : { title: "", type: "Kurs", priceCents: 0, desc: "" };
  openModal(`<h2>${offerId ? "Angebot bearbeiten" : "Neues Angebot"}</h2>
    <form id="offer-form" novalidate>
      <label for="f-title">Titel</label><input id="f-title" maxlength="80" value="${escapeHtml(offer.title)}">
      <label for="f-type">Art</label><select id="f-type">${["Reise", "Kurs", "Coaching", "Produkt"].map(t => `<option${t === offer.type ? " selected" : ""}>${t}</option>`).join("")}</select>
      <label for="f-price">Preis (€)</label><input id="f-price" type="number" min="1" max="50000" step="0.01" value="${offer.priceCents ? offer.priceCents / 100 : ""}">
      <label for="f-desc">Beschreibung</label><textarea id="f-desc" rows="3" maxlength="600">${escapeHtml(offer.desc)}</textarea>
      <div class="err" id="err"></div>
      <div class="actions" style="justify-content:flex-end;margin-top:8px"><button type="button" class="btn ghost" data-close>Abbrechen</button><button class="btn" type="submit">Speichern</button></div>
    </form>`, bg => {
    bg.querySelector("#offer-form").addEventListener("submit", e => {
      e.preventDefault();
      const title = bg.querySelector("#f-title").value.trim();
      const priceCents = Math.round(parseFloat(bg.querySelector("#f-price").value) * 100);
      const error = !title ? "Bitte einen Titel eingeben." : !(priceCents >= 100 && priceCents <= 5000000) ? "Preis zwischen 1 € und 50.000 € eingeben." : "";
      if (error) { bg.querySelector("#err").textContent = error; return; }
      const values = { title, type: bg.querySelector("#f-type").value, priceCents, desc: bg.querySelector("#f-desc").value.trim() };
      if (offerId) Object.assign(offerById(offerId), values);
      else state.offers.push({ id: newId("o"), memberId: currentMember().id, ...values });
      saveState(); closeModal(); render(); toast("Angebot gespeichert");
    });
  });
}

function confirmDelete(offerId) {
  const offer = offerById(offerId);
  const hasSales = state.orders.some(o => o.offerId === offerId);
  openModal(`<h2>Angebot löschen?</h2>
    <p>„${escapeHtml(offer.title)}“ wird ${hasSales ? "aus dem Shop genommen. Weil es schon Verkäufe gibt, bleibt es im Verlauf erhalten." : "endgültig entfernt."}</p>
    <div class="actions" style="justify-content:flex-end"><button class="btn ghost" data-close>Behalten</button><button class="btn" style="background:var(--red)" id="confirm-del">${hasSales ? "Aus dem Shop nehmen" : "Löschen"}</button></div>`, bg => {
    bg.querySelector("#confirm-del").addEventListener("click", () => {
      if (hasSales) offer.archived = true;
      else state.offers = state.offers.filter(o => o.id !== offerId);
      saveState(); closeModal(); render(); toast(hasSales ? "Angebot aus dem Shop genommen" : "Angebot gelöscht");
    });
  });
}

function openOnboarding() {
  const member = currentMember();
  let step = 0;
  const views = [
    () => `<h2>Deine Angaben</h2>
      <label>Vor- und Nachname</label><input value="${escapeHtml(member.name)}">
      <div class="split"><div><label>Geburtsdatum</label><input value="14.05.1986"></div><div><label>Land</label><select><option>Deutschland</option><option>Österreich</option><option>Schweiz</option></select></div></div>
      <label>Adresse</label><input value="Musterstraße 12, 79098 Freiburg">`,
    () => `<h2>Ausweis bestätigen</h2><p class="meta" style="color:var(--muted)">Stripe prüft deinen Ausweis einmalig. Family Travel Business sieht ihn nicht.</p>
      <div class="upload" id="upload">Foto von Personalausweis oder Reisepass hochladen</div>`,
    () => `<h2>Konto für Auszahlungen</h2>
      <label>IBAN</label><input value="DE89 3704 0044 0532 0130 00">
      <label>Kontoinhaber</label><input value="${escapeHtml(member.name)}">`,
    () => `<div class="center"><div class="ok-circle"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
      <h2>Geschafft!</h2><p>Stripe hat deine Angaben bestätigt. Sobald Family Travel Business dein Profil freigibt, kannst du verkaufen.</p></div>`
  ];
  const draw = () => {
    const last = step === views.length - 1;
    openModal(`<div class="stripe-head"><span>Sicher verifiziert über Stripe</span><button class="btn ghost small" data-close>Schließen</button></div>
      <div class="steps">${views.map((_, i) => `<i class="${i <= step ? "on" : ""}"></i>`).join("")}</div>
      ${views[step]()}
      <button class="btn wide" style="margin-top:22px" id="next">${last ? "Fertig" : "Weiter"}</button>`, bg => {
      bg.querySelector("#upload")?.addEventListener("click", e => { e.currentTarget.classList.add("done"); e.currentTarget.textContent = "Ausweis hochgeladen ✓"; });
      bg.querySelector("#next").addEventListener("click", () => {
        if (step === 1 && !bg.querySelector("#upload.done")) { toast("Bitte erst den Ausweis hochladen"); return; }
        if (last) { member.payouts = true; saveState(); closeModal(); render(); toast("Verkauf freigeschaltet"); return; }
        step += 1; draw();
      });
    });
  };
  draw();
}

function paySetupFee() {
  const member = currentMember();
  openModal(`<h2>Einrichtungsgebühr</h2>
    <div class="lines"><div><span>Profil im Netzwerk (einmalig)</span><span>${euro(state.setupFeeCents)}</span></div><div class="total"><span>Gesamt</span><span>${euro(state.setupFeeCents)}</span></div></div>
    <div class="stripe" style="margin-top:16px"><label style="margin-top:0">Kartennummer</label><input value="4242 4242 4242 4242"></div>
    <p class="note" style="margin-top:12px">Diese Zahlung geht direkt an Family Travel Business LLC.</p>
    <button class="btn wide" id="pay-setup-now" style="margin-top:12px">${euro(state.setupFeeCents)} bezahlen</button>`, bg => {
    bg.querySelector("#pay-setup-now").addEventListener("click", () => {
      member.setupPaid = true;
      state.setupFees.push({ memberId: member.id, cents: state.setupFeeCents, date: new Date().toISOString().slice(0, 10) });
      saveState(); closeModal(); render(); toast("Einrichtungsgebühr bezahlt");
    });
  });
}

function exportCsv() {
  const header = ["Mitglied", "Land", "Anzahl Verkäufe", "Umsatz EUR", "Provision EUR"];
  const rows = state.members.map(m => {
    const sales = memberSales(m.id);
    const gross = sales.reduce((s, o) => s + o.grossCents, 0);
    const commission = sales.reduce((s, o) => s + splitPayment(o.grossCents, o.commissionPercent).commissionCents, 0);
    return [m.name, "DE", sales.length, (gross / 100).toFixed(2), (commission / 100).toFixed(2)];
  });
  // Führende = + - @ Tab CR entschärfen, damit Excel keine Formeln ausführt.
  const cell = value => { let text = String(value); if (/^[=+\-@\t\r]/.test(text)) text = "'" + text; return '"' + text.replace(/"/g, '""') + '"'; };
  const csv = [header, ...rows].map(r => r.map(cell).join(";")).join("\n");
  const link = document.createElement("a");
  link.href = URL.createObjectURL(new Blob(["﻿" + csv], { type: "text/csv;charset=utf-8" }));
  link.download = "vermittelte-umsaetze-2026.csv";
  link.click();
  setTimeout(() => URL.revokeObjectURL(link.href), 1000);
}

/* ---------- Ereignisse ---------- */

function handleCheckout(form, offer) {
  const buyer = form.querySelector("#buyer").value.trim();
  const email = form.querySelector("#email").value.trim();
  const card = form.querySelector("#card")?.value.replace(/\s/g, "") ?? "";
  const method = paymentMethod;
  const errEl = form.querySelector("#err");
  if (!buyer) { errEl.textContent = "Bitte deinen Namen eingeben."; return; }
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { errEl.textContent = "Bitte eine gültige E-Mail-Adresse eingeben."; return; }
  if (method === "Karte" && card !== SUCCESS_TEST_CARD && card !== DECLINED_TEST_CARD) { errEl.textContent = "In der Vorschau gehen nur die beiden Testkarten."; return; }
  errEl.textContent = "";
  const payButton = form.querySelector("#pay");
  payButton.disabled = true;
  paymentInProgress = true;
  payButton.innerHTML = `<span class="spinner"></span> Zahlung läuft …`;
  setTimeout(() => {
    if (method === "Karte" && card === DECLINED_TEST_CARD) {
      paymentInProgress = false;
      payButton.disabled = false;
      payButton.textContent = `${euro(offer.priceCents)} bezahlen`;
      errEl.textContent = "Die Karte wurde abgelehnt. Bitte eine andere Zahlungsart wählen.";
      return;
    }
    if (!isBookable(offerById(offer.id))) {
      paymentInProgress = false;
      payButton.disabled = false;
      payButton.textContent = `${euro(offer.priceCents)} bezahlen`;
      errEl.textContent = "Dieses Angebot ist gerade nicht mehr buchbar.";
      return;
    }
    const order = { id: newId("b"), offerId: offer.id, buyer, email, grossCents: offer.priceCents, commissionPercent: state.commissionPercent, date: new Date().toISOString().slice(0, 10) };
    paymentInProgress = false;
    state.orders.push(order);
    saveState();
    location.hash = `#/fertig/${order.id}`;
  }, PROCESSING_DELAY_MS);
}

function saveProfile(form) {
  const member = currentMember();
  const name = form.querySelector("#p-name").value.trim();
  if (!name) { form.querySelector("#err").textContent = "Bitte einen Namen eingeben."; return; }
  Object.assign(member, { name, topic: form.querySelector("#p-topic").value.trim(), category: form.querySelector("#p-cat").value, bio: form.querySelector("#p-bio").value.trim() });
  saveState(); render(); toast("Profil gespeichert");
}

function saveSettings(form) {
  const commission = parseFloat(form.querySelector("#s-commission").value);
  const setupEuro = parseFloat(form.querySelector("#s-setup").value);
  if (!(commission >= 0 && commission <= 50)) { form.querySelector("#err").textContent = "Provision zwischen 0 und 50 % eingeben."; return; }
  if (!(setupEuro >= 0 && setupEuro <= 5000)) { form.querySelector("#err").textContent = "Gebühr zwischen 0 und 5.000 € eingeben."; return; }
  state.commissionPercent = commission;
  state.setupFeeCents = Math.round(setupEuro * 100);
  saveState(); render(); toast("Einstellungen gespeichert");
}

const ACTIONS = {
  "new-offer": () => openOfferDialog(null),
  "edit-offer": id => openOfferDialog(id),
  "delete-offer": id => confirmDelete(id),
  "onboard": () => openOnboarding(),
  "pay-setup": () => paySetupFee(),
  "export": () => exportCsv(),
  "view-as": id => { state.currentMemberId = id; saveState(); location.hash = "#/bereich/verkaeufe"; },
  "approve": id => { const m = memberById(id); if (!m?.setupPaid || !m.payouts) return; m.status = "aktiv"; saveState(); render(); toast("Mitglied freigegeben"); },
  "block": id => { memberById(id).status = "gesperrt"; saveState(); render(); toast("Mitglied gesperrt"); }
};

document.getElementById("app").addEventListener("click", e => {
  const chip = e.target.closest("[data-category]");
  if (chip) { activeCategory = chip.dataset.category; render(); return; }
  const method = e.target.closest("[data-method]");
  if (method && !paymentInProgress) { paymentMethod = method.dataset.method; render(); return; }
  const action = e.target.closest("[data-action]");
  if (action && !action.disabled) ACTIONS[action.dataset.action]?.(action.dataset.id);
});

document.getElementById("app").addEventListener("change", e => {
  if (e.target.id === "as-member") { state.currentMemberId = e.target.value; saveState(); render(); }
});

document.getElementById("app").addEventListener("submit", e => {
  e.preventDefault();
  const [, , id] = location.hash.split("/");
  if (e.target.id === "checkout") handleCheckout(e.target, offerById(id));
  if (e.target.id === "profile-form") saveProfile(e.target);
  if (e.target.id === "settings-form") saveSettings(e.target);
});

document.getElementById("reset").addEventListener("click", () => {
  state = seedData(); saveState(); location.hash = "#/"; render(); toast("Testdaten zurückgesetzt");
});

/* ---------- Router ---------- */

function render() {
  const [, section = "", param = ""] = (location.hash || "#/").split("/");
  const routes = {
    "": () => pageHome(),
    mitglied: () => pageMember(param),
    angebot: () => pageOffer(param),
    kasse: () => pageCheckout(param),
    fertig: () => pageDone(param),
    bereich: () => pageMemberArea(param),
    admin: () => pageAdmin(param),
    anleitung: () => pageGuide()
  };
  document.getElementById("app").innerHTML = (Object.hasOwn(routes, section) ? routes[section] : pageNotFound)();
  const navKey = ["bereich", "admin", "anleitung"].includes(section) ? section : "entdecken";
  document.querySelectorAll("[data-nav]").forEach(a => a.classList.toggle("on", a.dataset.nav === navKey));
}

let lastSection = null;
window.addEventListener("hashchange", () => {
  const section = location.hash.split("/")[1] || "";
  if (section !== lastSection) window.scrollTo(0, 0);
  lastSection = section;
  if (section !== "kasse") paymentMethod = "Karte";
  render();
});
render();
</script>
