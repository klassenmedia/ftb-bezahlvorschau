<style>
:root{
  --blue:#2f6bd8; --blue-dark:#1f4fa8; --blue-soft:#e8f0fd; --sky:#8fb3ee;
  --ink:#16213a; --muted:#5d6b85; --line:#e3e8f1; --bg:#f6f8fc; --card:#fff;
  --green:#1f9d63; --green-soft:#e5f6ee; --red:#d0453a; --red-soft:#fdecea; --amber:#b7791f; --amber-soft:#fdf4e3;
  --radius:18px; --shadow:0 1px 2px rgba(22,33,58,.06),0 8px 24px rgba(22,33,58,.06);
}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg);line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
.demo{position:sticky;top:0;z-index:20;background:var(--ink);color:#fff;font-size:13px;text-align:center;padding:7px 16px}
.demo button{background:none;border:0;color:var(--sky);text-decoration:underline;cursor:pointer;padding:0 0 0 8px}
header{background:#fff;border-bottom:1px solid var(--line)}
.testmode{margin-top:10px;text-align:center;font-size:13px;font-weight:600;color:var(--amber);background:var(--amber-soft);border-radius:10px;padding:8px}
header .wrap{display:flex;align-items:center;gap:24px;height:68px}
header img{height:34px;display:block}
nav{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
nav a{padding:8px 14px;border-radius:999px;font-size:15px;color:var(--muted)}
nav a.on{background:var(--blue-soft);color:var(--blue-dark);font-weight:600}
main{min-height:70vh;padding-bottom:64px}
h1{font-size:clamp(30px,5vw,48px);line-height:1.1;letter-spacing:-.02em;margin:0 0 14px}
h2{font-size:26px;letter-spacing:-.01em;margin:0 0 16px}
h3{font-size:18px;margin:0 0 6px}
.lead{font-size:18px;color:var(--muted);max-width:620px}
.hero{background:linear-gradient(135deg,var(--blue) 0%,var(--sky) 100%);color:#fff;border-radius:28px;margin:24px 0 36px;padding:56px 48px;position:relative;overflow:hidden}
.hero .lead{color:rgba(255,255,255,.9)}
.hero:after{content:"";position:absolute;right:-80px;bottom:-120px;width:380px;height:380px;border-radius:50%;background:rgba(255,255,255,.12)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 16px;cursor:pointer;font-size:15px}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column}
.card .pic{height:150px;display:flex;align-items:flex-end;padding:14px;color:#fff;font-weight:600;font-size:14px}
.card .body{padding:18px;display:flex;flex-direction:column;gap:8px;flex:1}
.card .meta{font-size:14px;color:var(--muted)}
.card .row{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:8px}
.price{font-weight:700;font-size:18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:11px 18px;font-weight:600;cursor:pointer;background:var(--blue);color:#fff;font-size:15px}
.btn:hover{background:var(--blue-dark)}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--bg)}
.btn.danger{background:#fff;color:var(--red);border:1px solid #f1c9c5}
.btn.small{padding:7px 12px;font-size:14px;border-radius:10px}
.btn.wide{width:100%;padding:14px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.avatar{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;flex:none}
.avatar.big{width:96px;height:96px;font-size:34px}
.seller{display:flex;gap:10px;align-items:center;font-size:14px}
.panel{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:24px}
.two{display:grid;grid-template-columns:1.4fr 1fr;gap:24px;align-items:start}
.back{display:inline-block;margin:24px 0 16px;color:var(--muted);font-size:15px}
.badge{display:inline-block;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--blue-soft);color:var(--blue-dark)}
.badge.green{background:var(--green-soft);color:var(--green)}
.badge.amber{background:var(--amber-soft);color:var(--amber)}
.badge.red{background:var(--red-soft);color:var(--red)}
.note{font-size:14px;color:var(--muted);background:var(--bg);border-radius:12px;padding:12px 14px}
label{display:block;font-size:14px;font-weight:600;margin:14px 0 6px}
input,select,textarea{width:100%;border:1px solid #cfd7e6;border-radius:10px;padding:11px 12px;background:#fff}
input:focus,select:focus,textarea:focus{outline:2px solid var(--blue-soft);border-color:var(--blue)}
.err{color:var(--red);font-size:14px;margin-top:8px;min-height:20px}
.split{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stripe{border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:8px}
.stripe .tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:6px}
.stripe .tab{border:1px solid var(--line);border-radius:10px;padding:10px 6px;font-size:13px;text-align:center;cursor:pointer;background:#fff}
.stripe .tab.on{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue);color:var(--blue-dark);font-weight:600}
.powered{font-size:12px;color:var(--muted);text-align:center;margin-top:12px}
.lines div{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
.lines div:last-child{border-bottom:0}
.lines .total{font-weight:700;font-size:17px}
.flow{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}
.flow div{background:var(--bg);border-radius:14px;padding:14px;text-align:center}
.flow b{display:block;font-size:20px}
.flow span{font-size:13px;color:var(--muted)}
.tabsbar{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:8px 0 24px;overflow-x:auto}
.tabsbar a{padding:12px 16px;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tabsbar a.on{color:var(--ink);border-color:var(--blue);font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:24px}
.kpi{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:20px}
.kpi span{font-size:14px;color:var(--muted)}
.kpi b{display:block;font-size:28px;letter-spacing:-.01em;margin-top:4px}
table{width:100%;border-collapse:collapse;font-size:15px}
th{text-align:left;font-size:13px;color:var(--muted);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line)}
td{padding:12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tablewrap{overflow-x:auto}
.empty{text-align:center;color:var(--muted);padding:40px 16px}
.list-item{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.list-item:last-child{border-bottom:0}
.list-item .grow{flex:1;min-width:0}
.actions{display:flex;gap:8px}
.modal-bg{position:fixed;inset:0;background:rgba(22,33,58,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal{background:#fff;border-radius:22px;max-width:480px;width:100%;padding:28px;max-height:92vh;overflow:auto}
.steps{display:flex;gap:6px;margin-bottom:20px}
.steps i{flex:1;height:4px;border-radius:4px;background:var(--line)}
.steps i.on{background:var(--blue)}
.stripe-head{display:flex;align-items:center;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:14px}
.upload{border:2px dashed #cfd7e6;border-radius:14px;padding:28px;text-align:center;cursor:pointer;color:var(--muted)}
.upload.done{border-color:var(--green);color:var(--green);background:var(--green-soft)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:12px;font-size:15px;z-index:60}
.spinner{width:18px;height:18px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ok-circle{width:72px;height:72px;border-radius:50%;background:var(--green-soft);color:var(--green);display:flex;align-items:center;justify-content:center;margin:0 auto 18px}
.center{text-align:center}
.profile-head{display:flex;gap:24px;align-items:center;margin-bottom:28px}
.faq{border-bottom:1px solid var(--line);padding:4px 0}
.faq:last-child{border-bottom:0}
.faq summary{cursor:pointer;font-weight:600;padding:12px 0;list-style-position:outside}
.faq p{margin:0 0 14px;color:var(--muted)}
.vshell{max-width:560px;margin:28px auto 0}
.vhead{display:flex;justify-content:space-between;align-items:center;font-weight:600;margin-bottom:16px}
.vsep{color:var(--muted);font-weight:400;margin:0 4px}
.vclose{font-size:14px;color:var(--muted);font-weight:400}
.vcard{background:#fff;border-radius:22px;box-shadow:var(--shadow);padding:28px}
.vcard h2{font-size:22px;margin-bottom:8px}
.vmuted{color:var(--muted);font-size:15px;margin:0 0 6px}
.small{font-size:13px}
.vfoot{text-align:center;font-size:12px;color:var(--muted);margin-top:14px}
.vprogress{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;margin-bottom:14px}
.vprogress div{display:flex;flex-direction:column;gap:5px;font-size:11px;color:var(--muted);text-align:center}
.vprogress i{height:4px;border-radius:4px;background:var(--line)}
.vprogress .done i,.vprogress .on i{background:var(--blue)}
.vprogress .on span{color:var(--ink);font-weight:600}
.choice{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;text-align:left;border:1px solid var(--line);border-radius:14px;background:#fff;padding:16px;margin-top:10px;cursor:pointer}
.choice span{font-size:14px;color:var(--muted)}
.choice.on{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue)}
.segmented{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--bg);border-radius:12px;padding:4px;margin-top:12px}
.segmented button{border:0;background:none;border-radius:9px;padding:9px 4px;font-size:14px;cursor:pointer}
.segmented button.on{background:#fff;box-shadow:var(--shadow);font-weight:600}
.selfie{background:var(--ink);border-radius:18px;height:240px;display:flex;align-items:center;justify-content:center;margin-top:12px}
.oval{width:140px;height:180px;border-radius:50%;border:3px dashed rgba(255,255,255,.6);display:flex;align-items:center;justify-content:center;color:#fff}
.selfie.done .oval{border:3px solid var(--green);color:var(--green)}
.bigspin{width:48px;height:48px;border:4px solid var(--blue-soft);border-top-color:var(--blue);border-radius:50%;animation:spin .9s linear infinite;margin:8px auto 20px}
@media (max-width:820px){.vprogress span{display:none}}
.mailshell{max-width:640px;margin:28px auto 0}
.mailclient{background:#fff;border-radius:18px;box-shadow:var(--shadow);overflow:hidden;margin-top:14px}
.mailmeta{display:flex;justify-content:space-between;gap:12px;padding:16px 20px 4px;font-size:14px;color:var(--muted)}
.mailmeta div{display:flex;flex-direction:column}
.mailmeta b{color:var(--ink)}
.mailsubject{padding:4px 20px 16px;font-weight:700;font-size:17px;border-bottom:1px solid var(--line)}
.mail{background:#f1f4f9;padding:24px 16px}
.mail>div{max-width:560px;margin:0 auto}
.mailhero{border-radius:14px 14px 0 0;overflow:hidden}
.maillogo{background:#fff;padding:22px;text-align:center}
.maillogo img{height:40px}
.mailband{background:linear-gradient(135deg,var(--blue),var(--sky));color:#fff;text-align:center;font-weight:700;font-size:20px;padding:26px 16px}
.mailbody{background:#fff;padding:24px 28px;font-size:16px;line-height:1.6}
.mailbody p{margin:0 0 14px}
.mailsmall{font-size:13px;color:var(--muted)}
.mailfoot{text-align:center;font-size:12px;color:var(--muted);padding:16px}
.slots{display:grid;gap:8px}
.slot{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:15px}
a.slot:hover{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue)}
.slot span{font-size:13px;color:var(--green);white-space:nowrap}
.slot.off{opacity:.55}
.slot.off span{color:var(--muted)}
footer{border-top:1px solid var(--line);padding:24px 0;font-size:13px;color:var(--muted)}
@media (max-width:820px){
  .two{grid-template-columns:1fr}
  .hero{padding:36px 24px}
  header .wrap{height:auto;padding-top:10px;padding-bottom:10px;flex-wrap:wrap;gap:8px}
  nav{margin-left:0;flex-wrap:nowrap;overflow-x:auto;max-width:100%;scrollbar-width:none}
  nav a{white-space:nowrap}
  .segmented button{font-size:13px}
  nav a{padding:6px 10px;font-size:14px}
  .flow{grid-template-columns:1fr}
  .profile-head{flex-direction:column;align-items:flex-start}
  .split{grid-template-columns:1fr}
}
</style>
</head>

const SAFE_ID = /^[a-z0-9]{1,40}$/;
const isSafeId = value => typeof value === "string" && SAFE_ID.test(value);
const isCents = value => Number.isInteger(value) && value >= 0 && value <= 100000000;
const isPrice = value => Number.isInteger(value) && value >= 100 && value <= 5000000;
const isPercent = value => Number.isFinite(value) && value >= 0 && value <= 50;
const isText = value => typeof value === "string" && value.length <= 600;

function isValidState(data) {
  if (!data || typeof data !== "object") return false;
  const { members, offers, orders, setupFees } = data;
  if (![members, offers, orders, setupFees].every(Array.isArray)) return false;
  if (!isPercent(data.commissionPercent) || !isCents(data.setupFeeCents) || !isSafeId(data.currentMemberId)) return false;
  const memberIds = new Set(members.map(m => m && m.id));
  const offerIds = new Set(offers.map(o => o && o.id));
  const dateIdsByOffer = new Map(offers.map(o => [o && o.id, new Set(Array.isArray(o?.dates) ? o.dates.map(d => d && d.id) : [])]));
  const isValidDate = d => d && isSafeId(d.id) && DATE_PATTERN.test(d.date) && TIME_PATTERN.test(d.time) && Number.isInteger(d.seats) && d.seats >= 1 && d.seats <= MAX_SEATS;
  return members.every(m => m && isSafeId(m.id) && [m.name, m.topic, m.category, m.city, m.bio, m.status].every(isText)
      && Number.isInteger(m.color) && m.color >= 0 && typeof m.payouts === "boolean" && typeof m.setupPaid === "boolean"
      && (m.email === undefined || (typeof m.email === "string" && m.email.length <= 120))
      && (m.emailConfirmed === undefined || typeof m.emailConfirmed === "boolean"))
    && offers.every(o => o && isSafeId(o.id) && memberIds.has(o.memberId) && [o.title, o.desc, o.location].every(isText) && OFFER_TYPES.includes(o.type)
      && isPrice(o.priceCents) && Number.isInteger(o.durationMin) && o.durationMin >= 15 && o.durationMin <= 1440
      && Array.isArray(o.dates) && o.dates.every(isValidDate)
      && (o.archived === undefined || typeof o.archived === "boolean"))
    && orders.every(o => o && isSafeId(o.id) && offerIds.has(o.offerId) && dateIdsByOffer.get(o.offerId).has(o.dateId) && isText(o.buyer) && isCents(o.grossCents)
      && isPercent(o.commissionPercent) && /^\d{4}-\d{2}-\d{2}$/.test(o.date))
    && setupFees.every(f => f && memberIds.has(f.memberId) && isCents(f.cents) && /^\d{4}-\d{2}-\d{2}$/.test(f.date))
    && memberIds.has(data.currentMemberId);
}

function loadState() {
  let raw = null;
  try {
    raw = localStorage.getItem(STORAGE_NAME);
  } catch (error) {
    console.warn("Browser-Speicher nicht verfügbar, starte mit Testdaten.", error);
  }
  if (!raw) return seedData();
  let parsed;
  try {
    parsed = JSON.parse(raw);
  } catch (error) {
    if (!(error instanceof SyntaxError)) throw error;
    console.warn("Gespeicherte Testdaten nicht lesbar, starte neu.", error);
    return seedData();
  }
  if (isValidState(parsed)) return parsed;
  console.warn("Gespeicherte Testdaten ungültig, starte neu.");
  return seedData();
}

let state = loadState();

function saveState() {
  try {
    localStorage.setItem(STORAGE_NAME, JSON.stringify(state));
  } catch (error) {
    console.warn("Testdaten konnten nicht gespeichert werden.", error);
  }
}

function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
}

function euro(cents) {
  return (cents / 100).toLocaleString("de-DE", { style: "currency", currency: "EUR" });
}

function formatDate(iso) {
  return new Date(iso + "T12:00:00").toLocaleDateString("de-DE", { day: "2-digit", month: "2-digit", year: "numeric" });
}

function splitPayment(grossCents, commissionPercent) {
  const commissionCents = Math.round(grossCents * commissionPercent / 100);
  const stripeFeeCents = Math.round(grossCents * STRIPE_PERCENT / 100) + STRIPE_FIXED_CENTS;
  return { commissionCents, stripeFeeCents, payoutCents: grossCents - commissionCents - stripeFeeCents };
}

const memberById = id => state.members.find(m => m.id === id);
const currentMember = () => memberById(state.currentMemberId) || state.members[0];
const offerById = id => state.offers.find(o => o.id === id);
const initials = name => name.split(" ").map(part => part[0]).join("").slice(0, 2).toUpperCase();
const avatar = (member, big) => `<div class="avatar${big ? " big" : ""}" style="background:${GRADIENTS[member.color % GRADIENTS.length]}">${escapeHtml(initials(member.name))}</div>`;
const sellerReady = offer => { const m = offer && memberById(offer.memberId); return Boolean(offer && !offer.archived && m && m.status === "aktiv" && m.payouts); };
const bookedSeats = (offer, dateId) => state.orders.filter(o => o.offerId === offer.id && o.dateId === dateId).length;
const freeSeats = (offer, date) => date.seats - bookedSeats(offer, date.id);
const upcomingDates = offer => offer.dates.filter(d => d.date > todayIso()).sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));
const bookableDates = offer => upcomingDates(offer).filter(d => freeSeats(offer, d) > 0);
const isBookable = offer => sellerReady(offer) && bookableDates(offer).length > 0;
const dateById = (offer, dateId) => offer?.dates.find(d => d.id === dateId);
const isDateBookable = (offer, dateId) => { const d = dateById(offer, dateId); return sellerReady(offer) && Boolean(d) && d.date > todayIso() && freeSeats(offer, d) > 0; };
const isGroupOffer = offer => offer.type !== SINGLE_SEAT_TYPE;

function formatSlot(date) {
  const day = new Date(date.date + "T12:00:00").toLocaleDateString("de-DE", { weekday: "short", day: "2-digit", month: "2-digit", year: "numeric" });
  return `${day} · ${date.time} Uhr`;
}

function seatsLabel(offer, date) {
  const free = freeSeats(offer, date);
  if (free <= 0) return isGroupOffer(offer) ? "ausgebucht" : "vergeben";
  return isGroupOffer(offer) ? `noch ${free} von ${date.seats} Plätzen` : "frei";
}
const newId = prefix => prefix + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

function toast(message) {
  const el = document.createElement("div");
  el.className = "toast";
  el.textContent = message;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2600);
}

function createMember(fields) {
  const name = fields.name.trim();
  const topic = fields.topic.trim();
  const city = fields.city.trim();
  if (!name || !topic || !city) return { error: "Bitte Name, Thema und Ort ausfüllen." };
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(fields.email.trim())) return { error: "Bitte eine gültige E-Mail-Adresse eingeben." };
  if (!CATEGORIES.includes(fields.category)) return { error: "Bitte einen Bereich wählen." };
  const member = {
    id: newId("m"), name: name.slice(0, SIGNUP_LIMITS.name), topic: topic.slice(0, SIGNUP_LIMITS.topic), category: fields.category,
    city: city.slice(0, SIGNUP_LIMITS.city), color: state.members.length % GRADIENTS.length, status: "wartet", payouts: false, setupPaid: false,
    bio: fields.bio.trim().slice(0, SIGNUP_LIMITS.bio), email: fields.email.trim().slice(0, 120), emailConfirmed: false
  };
  state.members.push(member);
  state.currentMemberId = member.id;
  saveState();
  return { member };
}

function submitSignup(form) {

function passwordError(password, repeat) {
  if (password.length < MIN_PASSWORD_LENGTH) return `Bitte mindestens ${MIN_PASSWORD_LENGTH} Zeichen verwenden.`;

  if (password !== repeat) return "Die beiden Passwörter stimmen nicht überein.";
  return "";
}

// Nur Mitglieder ohne Verkäufe sind löschbar; mit Verkäufen bleibt nur Sperren.
function deleteMember(memberId) {
  const member = memberById(memberId);
  if (!member || memberSales(memberId).length || state.members.length < 2) return false;
  state.members = state.members.filter(m => m.id !== memberId);
  state.offers = state.offers.filter(o => o.memberId !== memberId);
  state.setupFees = state.setupFees.filter(f => f.memberId !== memberId);
  if (state.currentMemberId === memberId) state.currentMemberId = state.members[0].id;
  if (verification?.memberId === memberId) verification = null;
  saveState();
  return true;
}

function openModal(html, onMount) {

  bg.addEventListener("click", e => { if (e.target === bg || e.target.closest("[data-close]")) closeModal(); });
  document.body.appendChild(bg);
  onMount?.(bg);
}

function closeModal() {
  document.getElementById("modal")?.remove();
}

const OFFER_LIMITS = { title: 80, location: 80, desc: 600 };

function saveOffer(offerId, fields) {
  const title = fields.title.trim().slice(0, OFFER_LIMITS.title);
  const location = fields.location.trim().slice(0, OFFER_LIMITS.location);
  const priceCents = Math.round(parseFloat(fields.price) * 100);
  const durationMin = parseInt(fields.duration, 10);
  if (!title || !location) return { error: "Bitte Titel und Ort eingeben." };
  if (!OFFER_TYPES.includes(fields.type)) return { error: "Bitte eine Art auswählen." };
  if (!(priceCents >= 100 && priceCents <= 5000000)) return { error: "Preis zwischen 1 € und 50.000 € eingeben." };
  if (!(durationMin >= 15 && durationMin <= 1440)) return { error: "Dauer zwischen 15 und 1.440 Minuten eingeben." };
  const values = { title, type: fields.type, priceCents, durationMin, location, desc: fields.desc.trim().slice(0, OFFER_LIMITS.desc) };
  if (offerId) {
    const offer = offerById(offerId);
    if (!offer || offer.memberId !== currentMember().id) return { error: "Angebot nicht gefunden." };
    Object.assign(offer, values);
    saveState();
    return { offer };
  }
  const offer = { id: newId("o"), memberId: currentMember().id, dates: [], ...values };
  state.offers.push(offer);
  saveState();
  return { offer };
}

      <div class="actions" style="justify-content:flex-end;margin-top:8px"><button type="button" class="btn ghost" data-close>Abbrechen</button><button class="btn" type="submit">${offerId ? "Speichern" : "Weiter zu den Terminen"}</button></div>
    </form>`, bg => {
    bg.querySelector("#offer-form").addEventListener("submit", e => {
      e.preventDefault();
      const value = id => bg.querySelector(id).value;
      const result = saveOffer(offerId, { title: value("#f-title"), type: value("#f-type"), price: value("#f-price"), duration: value("#f-duration"), location: value("#f-location"), desc: value("#f-desc") });
      if (result.error) { bg.querySelector("#err").textContent = result.error; return; }
      closeModal(); render(); toast("Angebot gespeichert");
      if (!offerId) openDatesDialog(result.offer.id);
    });
  });
}

function addOfferDate(offerId, fields) {
  const offer = offerById(offerId);
  if (!offer || offer.memberId !== currentMember().id) return { error: "Angebot nicht gefunden." };
  const seats = isGroupOffer(offer) ? parseInt(fields.seats, 10) : 1;
  if (!DATE_PATTERN.test(fields.date) || fields.date <= todayIso()) return { error: "Bitte ein Datum ab morgen wählen." };
  if (!TIME_PATTERN.test(fields.time)) return { error: "Bitte eine Uhrzeit wählen." };
  if (!(seats >= 1 && seats <= MAX_SEATS)) return { error: `Plätze zwischen 1 und ${MAX_SEATS} eingeben.` };
  if (offer.dates.some(d => d.date === fields.date && d.time === fields.time)) return { error: "Diesen Termin gibt es schon." };
  const date = { id: newId("d"), date: fields.date, time: fields.time, seats };
  offer.dates.push(date);
  saveState();
  return { date };
}

// Termine mit Buchungen bleiben stehen, damit keine Buchung ins Leere zeigt.
function removeOfferDate(offerId, dateId) {
  const offer = offerById(offerId);
  if (!offer || offer.memberId !== currentMember().id || !dateById(offer, dateId) || bookedSeats(offer, dateId) > 0) return false;
  offer.dates = offer.dates.filter(d => d.id !== dateId);
  saveState();
  return true;
}

function openDatesDialog(offerId) {
  const offer = offerById(offerId);
  if (!offer) return;
  const group = isGroupOffer(offer);
  const list = upcomingDates(offer).map(d => `<div class="list-item">
      <div class="grow"><b>${formatSlot(d)}</b><div class="meta" style="color:var(--muted)">${group ? `${bookedSeats(offer, d.id)} von ${d.seats} Plätzen gebucht` : bookedSeats(offer, d.id) ? "gebucht" : "frei"}</div></div>
      ${bookedSeats(offer, d.id) ? `<span class="badge green">hat Buchungen</span>` : `<button class="btn danger small" data-remove-date="${d.id}">Löschen</button>`}
    </div>`).join("");
  openModal(`<h2>Termine: ${escapeHtml(offer.title)}</h2>
    <div>${list || `<p class="note">Noch keine Termine. Leg den ersten an, dann ist das Angebot buchbar.</p>`}</div>
    <form id="date-form" novalidate style="margin-top:12px">
      <div class="split"><div><label for="t-date">Datum</label><input id="t-date" type="date" min="${dayFromToday(1)}" value="${dayFromToday(7)}"></div>
        <div><label for="t-time">Uhrzeit</label><input id="t-time" type="time" value="10:00"></div></div>
      ${group ? `<label for="t-seats">Plätze</label><input id="t-seats" type="number" min="1" max="${MAX_SEATS}" value="12">` : ""}
      <div class="err" id="err"></div>
      <div class="actions" style="justify-content:flex-end;margin-top:8px"><button type="button" class="btn ghost" data-close>Fertig</button><button class="btn" type="submit">Termin hinzufügen</button></div>
    </form>`, bg => {
    bg.querySelector("#date-form").addEventListener("submit", e => {
      e.preventDefault();
      const result = addOfferDate(offerId, { date: bg.querySelector("#t-date").value, time: bg.querySelector("#t-time").value, seats: bg.querySelector("#t-seats")?.value ?? "1" });
      if (result.error) { bg.querySelector("#err").textContent = result.error; return; }
      render(); openDatesDialog(offerId); toast("Termin hinzugefügt");
    });
    bg.querySelectorAll("[data-remove-date]").forEach(button => button.addEventListener("click", () => {
      if (removeOfferDate(offerId, button.dataset.removeDate)) { render(); openDatesDialog(offerId); toast("Termin gelöscht"); }
    }));
  });
}

function confirmDelete(offerId) {
  const offer = offerById(offerId);
  const hasSales = state.orders.some(o => o.offerId === offerId);
  openModal(`<h2>Angebot löschen?</h2>
    <p>„${escapeHtml(offer.title)}“ wird ${hasSales ? "aus dem Shop genommen. Weil es schon Verkäufe gibt, bleibt es im Verlauf erhalten." : "endgültig entfernt."}</p>
    <div class="actions" style="justify-content:flex-end"><button class="btn ghost" data-close>Behalten</button><button class="btn" style="background:var(--red)" id="confirm-del">${hasSales ? "Aus dem Shop nehmen" : "Löschen"}</button></div>`, bg => {
    bg.querySelector("#confirm-del").addEventListener("click", () => {
      if (hasSales) offer.archived = true;
      else state.offers = state.offers.filter(o => o.id !== offerId);
      saveState(); closeModal(); render(); toast(hasSales ? "Angebot aus dem Shop genommen" : "Angebot gelöscht");
    });
  });
}

function pageVerification() {

    <form class="vcard" id="verify-form" novalidate>${verificationBody(member)}
      <div class="err" id="err"></div>

    </form>`);
}

function stepError(form) {
  const v = verification;
  const value = id => form.querySelector(id)?.value.trim() ?? "";
  if (v.step === "konto" && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value("#v-email"))) return "Bitte eine gültige E-Mail-Adresse eingeben.";
  if (v.step === "code" && value("#v-code") !== TEST_SMS_CODE) return `Der Code stimmt nicht. In der Vorschau: ${TEST_SMS_CODE}`;
  if (v.step === "person") {
    if (!value("#v-first") || !value("#v-last") || !value("#v-street") || !value("#v-city")) return "Bitte alle Felder ausfüllen.";
    const street = value("#v-street");
    v.needsAddressProof = /postfach|c\/o|packstation/i.test(street);
    v.address = `${street}, ${value("#v-zip")} ${value("#v-city")}`;
  }
  if (v.step === "ausweis" && (!v.front || (v.docType !== "Reisepass" && !v.back))) return "Bitte beide Seiten des Ausweises aufnehmen.";
  if (v.step === "selfie" && !v.selfie) return "Bitte ein Selfie aufnehmen.";
  if (v.step === "bank" && !/^[A-Z]{2}\d{2}[A-Z0-9 ]{10,30}$/.test(value("#v-iban").toUpperCase())) return "Bitte eine gültige IBAN eingeben.";
  return "";
}

function submitVerificationStep(form) {
  const error = stepError(form);
  if (error) { form.querySelector("#err").textContent = error; return; }
  const index = VERIFY_STEPS.indexOf(verification.step);
  if (verification.step !== "pruefen") { verification.step = VERIFY_STEPS[index + 1]; render(); return; }
  runVerificationCheck();
}

function runVerificationCheck() {
  const v = activeVerification();
  if (!v) return;
  v.phase = "checking";
  render();
  setTimeout(() => {
    if (activeVerification() !== v || location.hash !== "#/verifizierung") { v.phase = "form"; return; }
    if (v.needsAddressProof && !v.addressProof) { v.phase = "address"; render(); return; }
    const member = memberById(v.memberId);
    if (!member?.setupPaid) { verification = null; render(); return; }
    member.payouts = true;
    saveState();
    v.phase = "done";
    render();
  }, VERIFY_DELAY_MS);
}

function exportCsv() {
  const header = ["Mitglied", "Land", "Anzahl Verkäufe", "Umsatz EUR", "Provision EUR"];
  const rows = state.members.map(m => {
    const sales = memberSales(m.id);
    const gross = sales.reduce((s, o) => s + o.grossCents, 0);
    const commission = sales.reduce((s, o) => s + splitPayment(o.grossCents, o.commissionPercent).commissionCents, 0);
    return [m.name, "DE", sales.length, (gross / 100).toFixed(2), (commission / 100).toFixed(2)];
  });
  // Führende = + - @ Tab CR entschärfen, damit Excel keine Formeln ausführt.
  const cell = value => { let text = String(value); if (/^[=+\-@\t\r]/.test(text)) text = "'" + text; return '"' + text.replace(/"/g, '""') + '"'; };
  const csv = [header, ...rows].map(r => r.map(cell).join(";")).join("\n");
  const link = document.createElement("a");
  link.href = URL.createObjectURL(new Blob(["﻿" + csv], { type: "text/csv;charset=utf-8" }));
  link.download = "vermittelte-umsaetze-2026.csv";
  link.click();
  setTimeout(() => URL.revokeObjectURL(link.href), 1000);
}

/* ---------- Ereignisse ---------- */

function handleCheckout(form, offer, dateId) {
  if (!isDateBookable(offer, dateId)) { form.querySelector("#err").textContent = "Dieser Termin ist nicht mehr frei."; return; }
  const buyer = form.querySelector("#buyer").value.trim();
  const email = form.querySelector("#email").value.trim();
  const card = form.querySelector("#card")?.value.replace(/\s/g, "") ?? "";
  const method = paymentMethod;
  const errEl = form.querySelector("#err");
  if (!buyer) { errEl.textContent = "Bitte deinen Namen eingeben."; return; }
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { errEl.textContent = "Bitte eine gültige E-Mail-Adresse eingeben."; return; }
  if (method === "Karte" && card !== SUCCESS_TEST_CARD && card !== DECLINED_TEST_CARD) { errEl.textContent = "In der Vorschau gehen nur die beiden Testkarten."; return; }
  errEl.textContent = "";
  const payButton = form.querySelector("#pay");
  payButton.disabled = true;
  paymentInProgress = true;
  payButton.innerHTML = `<span class="spinner"></span> Zahlung läuft …`;
  setTimeout(() => {
    if (method === "Karte" && card === DECLINED_TEST_CARD) {
      paymentInProgress = false;
      payButton.disabled = false;
      payButton.textContent = `${euro(offer.priceCents)} bezahlen`;
      errEl.textContent = "Die Karte wurde abgelehnt. Bitte eine andere Zahlungsart wählen.";
      return;
    }
    if (!isDateBookable(offerById(offer.id), dateId)) {
      paymentInProgress = false;
      payButton.disabled = false;
      payButton.textContent = `${euro(offer.priceCents)} bezahlen`;
      errEl.textContent = "Dieser Termin ist gerade vergeben worden. Bitte einen anderen wählen.";
      return;
    }
    const order = { id: newId("b"), offerId: offer.id, dateId, buyer, email, grossCents: offer.priceCents, commissionPercent: state.commissionPercent, date: new Date().toISOString().slice(0, 10) };
    paymentInProgress = false;
    state.orders.push(order);
    saveState();
    location.hash = `#/fertig/${order.id}`;
  }, PROCESSING_DELAY_MS);
}

function saveProfile(form) {
  const member = currentMember();
  const name = form.querySelector("#p-name").value.trim();
  if (!name) { form.querySelector("#err").textContent = "Bitte einen Namen eingeben."; return; }
  Object.assign(member, { name, topic: form.querySelector("#p-topic").value.trim(), category: form.querySelector("#p-cat").value, bio: form.querySelector("#p-bio").value.trim() });
  saveState(); render(); toast("Profil gespeichert");
}

function saveSettings(form) {
  const commission = parseFloat(form.querySelector("#s-commission").value);
  const setupEuro = parseFloat(form.querySelector("#s-setup").value);
  if (!(commission >= 0 && commission <= 50)) { form.querySelector("#err").textContent = "Provision zwischen 0 und 50 % eingeben."; return; }
  if (!(setupEuro >= 0 && setupEuro <= 5000)) { form.querySelector("#err").textContent = "Gebühr zwischen 0 und 5.000 € eingeben."; return; }
  state.commissionPercent = commission;
  state.setupFeeCents = Math.round(setupEuro * 100);
  saveState(); render(); toast("Einstellungen gespeichert");
}

  "new-offer": () => openOfferDialog(null),

  "onboard": () => startVerification(),
  "sample": key => { const v = activeVerification(); if (v && Object.hasOwn(SAMPLE_FIELDS, key)) { v[SAMPLE_FIELDS[key]] = true; render(); } },
  "kind": kind => { const v = activeVerification(); if (v && SELLER_KINDS.includes(kind)) { v.kind = kind; render(); } },
  "doctype": type => { const v = activeVerification(); if (v && DOC_TYPES.includes(type)) { Object.assign(v, { docType: type, front: false, back: false }); render(); } },
  "verify-back": () => { const v = activeVerification(); const i = v ? VERIFY_STEPS.indexOf(v.step) : -1; if (i > 0) { v.step = VERIFY_STEPS[i - 1]; render(); } },
  "verify-next": () => { const v = activeVerification(); if (v?.phase === "address" && v.addressProof) runVerificationCheck(); },
  "pay-setup": () => { if (currentMember().emailConfirmed !== false) paySetupFee(); },
  "export": () => exportCsv(),
  "view-as": id => { state.currentMemberId = id; saveState(); location.hash = "#/bereich/verkaeufe"; },
  "approve": id => { const m = memberById(id); if (!m?.setupPaid || !m.payouts) return; m.status = "aktiv"; saveState(); render(); toast("Mitglied freigegeben"); },
  "delete-member": id => confirmDeleteMember(id),
  "block": id => { memberById(id).status = "gesperrt"; saveState(); render(); toast("Mitglied gesperrt"); }
};

document.getElementById("app").addEventListener("click", e => {
  const chip = e.target.closest("[data-category]");
  if (chip) { activeCategory = chip.dataset.category; render(); return; }
  const method = e.target.closest("[data-method]");
  if (method && !paymentInProgress) { paymentMethod = method.dataset.method; render(); return; }
  const action = e.target.closest("[data-action]");
  if (action && !action.disabled) ACTIONS[action.dataset.action]?.(action.dataset.id);
});

document.getElementById("app").addEventListener("change", e => {
  if (e.target.id === "as-member") { state.currentMemberId = e.target.value; saveState(); render(); }
});

document.getElementById("app").addEventListener("submit", e => {
  e.preventDefault();
  const [, , id, dateId] = location.hash.split("/");
  if (e.target.id === "checkout" && !paymentInProgress) handleCheckout(e.target, offerById(id), dateId);
  if (e.target.id === "profile-form") saveProfile(e.target);
  if (e.target.id === "settings-form") saveSettings(e.target);
  if (e.target.id === "verify-form" && activeVerification()) submitVerificationStep(e.target);
  if (e.target.id === "signup-form") submitSignup(e.target);
  if (e.target.id === "password-form") submitPassword(e.target);
});

document.getElementById("reset").addEventListener("click", () => {
  verification = null; state = seedData(); saveState(); location.hash = "#/"; render(); toast("Testdaten zurückgesetzt");
});

/* ---------- Router ---------- */

function render() {
  const [, section = "", param = "", param2 = ""] = (location.hash || "#/").split("/");
  const routes = {
    "": () => pageHome(),
    mitglied: () => pageMember(param),
    angebot: () => pageOffer(param),
    kasse: () => pageCheckout(param, param2),
    fertig: () => pageDone(param),
    bereich: () => pageMemberArea(param),
    admin: () => pageAdmin(param),
    anleitung: () => pageGuide(),
    verifizierung: () => pageVerification(),
    "mitglied-werden": () => pageSignup(),
    postfach: () => pageInbox(),
    passwort: () => pagePassword()
  };
  document.getElementById("app").innerHTML = (Object.hasOwn(routes, section) ? routes[section] : pageNotFound)();
  const navKey = ["verifizierung", "mitglied-werden", "postfach", "passwort"].includes(section) ? "bereich" : ["bereich", "admin", "anleitung"].includes(section) ? section : "entdecken";
  document.querySelectorAll("[data-nav]").forEach(a => a.classList.toggle("on", a.dataset.nav === navKey));
}

let lastSection = null;
window.addEventListener("hashchange", () => {
  const section = location.hash.split("/")[1] || "";
  if (section !== lastSection) window.scrollTo(0, 0);
  lastSection = section;
  if (section !== "kasse") paymentMethod = "Karte";
  render();
});
render();
</script>
</body>
</html>
